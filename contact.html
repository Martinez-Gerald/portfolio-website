<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gerald Martinez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="back-link">← Initialize Home</a>
    </nav>

    <main class="page-container">
        
        <div class="section-header">
            <h1 class="section-title">Establish Connection</h1>
            <div class="title-underline"></div>
        </div>

        <div class="contact-layout">
            
            <section class="contact-info-section">
                <h2 class="sub-heading"></h2>
                <p class="contact-desc">Whether you have a question about my data projects, want to discuss database architecture, or have an opportunity to share, my inbox is open.</p>

                <div class="contact-cards">
                    <div class="contact-card">
                        <span class="contact-icon">📍</span>
                        <div>
                            <h4>Location</h4>
                            <p>Remote</p>
                        </div>
                    </div>

                    <a href="mailto:martinezgerald.925@outlook.com" class="contact-card link-card">
                        <span class="contact-icon">✉️</span>
                        <div>
                            <h4>Email</h4>
                            <p>Direct Message</p>
                        </div>
                    </a>

                    <a href="https://linkedin.com/in/gerald-martinez" target="_blank" class="contact-card link-card">
                        <span class="contact-icon">💼</span>
                        <div>
                            <h4>LinkedIn</h4>
                            <p>Professional Network</p>
                        </div>
                    </a>

                    <a href="https://github.com/martinez-gerald" target="_blank" class="contact-card link-card">
                        <span class="contact-icon">💻</span>
                        <div>
                            <h4>GitHub</h4>
                            <p>Code Repositories</p>
                        </div>
                    </a>
                </div>
            </section>

            <section class="contact-form-section">
                <form id="contact-form" action="https://formspree.io/f/meaqpvnq" method="POST" class="cyber-form">

                    <div class="form-group">
                        <label for="name">Name / Alias</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Return Address (Email)</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject Directive</label>
                        <input type="text" id="subject" name="subject" required placeholder="Reason for contact">
                    </div>

                    <div class="form-group">
                        <label for="message">Encrypted Payload (Message)</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
                    </div>

                    <p id="form-status" class="form-status" hidden></p>

                    <button type="submit" class="submit-btn">Transmit Message</button>
                </form>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
